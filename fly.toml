# Modèle Fly.io pour UN nœud. Pour 3 nœuds, copiez ce fichier et changez « app » :
#   fly launch --no-deploy --copy-config --name kincoin-node-1
#   fly secrets set PEERS=https://kincoin-node-2.fly.dev,https://kincoin-node-3.fly.dev ADMIN_TOKEN=…
#   fly deploy
app = "kincoin-node-1"
primary_region = "cdg"

[build]

[env]
  NODE_NAME = "noeud-1"
  MINING = "1"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"   # un nœud doit rester allumé pour miner et relayer
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
